# Fork-only: merge the newest DuarteSantos8/openGym release into main. Railway deploys main,
# so a new upstream release reaches the deployment without anyone touching this repo.
#
# Needs the UPSTREAM_SYNC_TOKEN secret: a fine-grained PAT for this repository with
# Contents: read/write and Workflows: read/write. The default GITHUB_TOKEN cannot push a
# merge that changes files under .github/workflows, which upstream releases often do.
name: Sync upstream release

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-release
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'leshz/openGym'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_SYNC_TOKEN }}

      - name: Merge the latest upstream release
        run: |
          set -eu
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream https://github.com/DuarteSantos8/openGym.git
          git fetch --quiet --tags upstream
          tag="$(git tag -l 'v*' --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1)"
          if [ -z "$tag" ]; then echo "::error::no upstream release tag found"; exit 1; fi
          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "Already on $tag — nothing to do."
            exit 0
          fi
          echo "Merging upstream $tag"
          git merge --no-edit -m "chore: merge upstream release $tag" "$tag"
          git push origin HEAD:main
          echo "### Merged upstream $tag" >> "$GITHUB_STEP_SUMMARY"
